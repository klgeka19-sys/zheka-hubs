<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zheka Hubs</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Большой адаптивный баннер в шапке сайта */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 45vh;
            min-height: 280px;
            max-height: 500px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), #121212), url('banner.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        .banner-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Неоновые буквы */
        .logo-text {
            font-size: 32px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            text-shadow: 0 0 10px #00bcff, 0 0 20px #00bcff, 0 0 30px #00bcff;
        }

        /* Синяя кнопка меню (три полоски) */
        .menu-btn {
            background: rgba(0, 188, 255, 0.85);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            box-shadow: 0 0 15px rgba(0, 188, 255, 0.4);
            z-index: 100; /* Чтобы быть поверх баннера */
        }

        .menu-btn span {
            display: block;
            width: 24px;
            height: 3px;
            background: #121212;
            border-radius: 2px;
        }

        /* ВЫЕЗЖАЮЩЕЕ БОКОВОЕ МЕНЮ (ШТОРКА) */
        .side-menu {
            position: fixed;
            top: 0;
            right: -280px; /* Изначально спрятано за экраном справа */
            width: 280px;
            height: 100vh;
            background: #1a1a1a;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.5);
            transition: right 0.3s ease;
            z-index: 999;
            padding: 80px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-left: 2px solid #00bcff;
        }

        /* Класс, который активируется через JS при клике */
        .side-menu.open {
            right: 0;
        }

        /* Кнопка закрытия внутри шторки */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #888;
            font-size: 28px;
            cursor: pointer;
        }

        /* Пункты меню */
        .menu-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            background: #242424;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
            border: 1px solid transparent;
        }

        .menu-item:active, .menu-item.active {
            background: #2a2a2a;
            border-color: #00bcff;
            color: #00bcff;
        }

        .menu-item-icon {
            font-size: 22px;
        }

        /* Темная подложка-затемнение при открытии меню */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 998;
        }

        .overlay.active {
            display: block;
        }

        /* Основной контент сайта */
        .main-content {
            max-width: 800px;
            width: 100%;
            padding: 20px;
        }

        .section-title {
            font-size: 28px;
            margin-bottom: 20px;
            border-left: 4px solid #00bcff;
            padding-left: 10px;
        }

        /* Область вывода фото/видео/музыки */
        .gallery-display {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2d2d2d;
            margin-top: 10px;
        }

        .gallery-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #00bcff;
        }

        .photos-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .photos-list img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            background: #2a2a2a;
        }
    </style>
</head>
<body>

    <!-- Затемнение заднего фона при открытом меню -->
    <div class="overlay" id="menuOverlay" onclick="toggleMenu()"></div>

    <!-- Шапка-баннер с аниме -->
    <div class="hero-banner">
        <div class="banner-content">
            <span class="logo-text">Zheka Hubs</span>
            <button class="menu-btn" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>

    <!-- ВЫЕЗЖАЮЩЕЕ БОКОВОЕ МЕНЮ -->
    <div class="side-menu" id="sideMenu">
        <button class="close-btn" onclick="toggleMenu()">×</button>
        
        <div class="menu-item active" onclick="changeCategory('my-photos', 'Фотографии')">
            <span class="menu-item-icon">🖼️</span>
            <span>Фото</span>
        </div>
        <div class="menu-item" onclick="changeCategory('videos', 'Видеозаписи')">
            <span class="menu-item-icon">🎬</span>
            <span>Видео</span>
        </div>
        <div class="menu-item" onclick="changeCategory('music', 'Музыка')">
            <span class="menu-item-icon">🎵</span>
            <span>Мьюзик</span>
        </div>
        <div class="menu-item" onclick="changeCategory('others', 'Разное')">
            <span class="menu-item-icon">⚙️</span>
            <span>Всё такое</span>
        </div>
    </div>

    <!-- Основной блок сайта -->
    <main class="main-content">
        <h2 class="section-title">Контент профиля</h2>

        <!-- Галерея (динамически меняется контент) -->
        <div class="gallery-display" id="galleryDisplay">
            <h3 class="gallery-title" id="currentAlbumTitle">Фотографии</h3>
            <div class="photos-list" id="photosContainer">
                <!-- По умолчанию показываем заглушку для Фото -->
                <p style="color: #666;">В разделе «Фотографии» пока пусто...</p>
            </div>
        </div>
    </main>

    <script>
        // Функция открытия/закрытия меню
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            const overlay = document.getElementById('menuOverlay');
            menu.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        // База данных контента для разделов шторки
        const mediaData = {
            'my-photos': ['my-photos/photo1.jpg'],
            'videos': [], // Сюда потом вставим видео файлы
            'music': ['Simon Curtis- Superhero.mp3'],  // Сюда треки
            'others': []
        };

        // Функция переключения вкладок через боковую шторку
        function changeCategory(key, displayName)
            const title = document.getElementById('currentAlbumTitle');
            const container = document.getElementById('photosContainer');
            
            // Подсвечиваем активный пункт в меню
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // Закрываем меню после выбора (для мобилок удобно)
            toggleMenu();

            // Меняем заголовок главного блока
            title.textContent = displayName;
            container.innerHTML = '';

            const items = mediaData[key] || [];

            if(items.length === 0) {
                container.innerHTML = `<p style="color: #666;">В разделе «${displayName}» пока ничего нет...</p>`;
            } else {
                // Если это фото, генерируем картинки
                if (key === 'my-photos') {
                    items.forEach(src => {
                        const img = document.createElement('img');
                        img.src = src;
                        img.alt = 'Media';
                        img.onerror = function() {
                            this.src = 'https://placeholder.com';
                        };
                        container.appendChild(img);
                    });
                }
            }
        }
    </script>
</body>
    </html>
