<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zheka Hubs</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Большой адаптивный баннер в шапке сайта */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 45vh;
            min-height: 280px;
            max-height: 500px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), #121212), url('banner.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        /* Контейнер для текста поверх баннера */
        .banner-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Неоновые буквы */
        .logo-text {
            font-size: 32px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            text-shadow: 0 0 10px #00bcff, 0 0 20px #00bcff, 0 0 30px #00bcff;
        }

        /* Кнопка меню */
        .menu-btn {
            background: rgba(0, 188, 255, 0.85);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            box-shadow: 0 0 15px rgba(0, 188, 255, 0.4);
        }

        .menu-btn span {
            display: block;
            width: 24px;
            height: 3px;
            background: #121212;
            border-radius: 2px;
        }

        /* Основной контент */
        .main-content {
            max-width: 800px;
            width: 100%;
            padding: 20px;
        }

        .section-title {
            font-size: 28px;
            margin-bottom: 20px;
            border-left: 4px solid #00bcff;
            padding-left: 10px;
        }

        /* Сетка альбомов (папок) */
        .albums-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        /* Карточки папок */
        .album-card {
            background: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .album-card:active {
            background: #252525;
            border-color: #00bcff;
        }

        .folder-icon {
            font-size: 45px;
            color: #ffca28;
        }

        /* Подсказка */
        .info-note {
            border: 1px dashed #444;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Галерея */
        .gallery-display {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            display: none;
            border: 1px solid #2d2d2d;
        }

        .gallery-display.visible {
            display: block;
        }

        .gallery-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #00bcff;
        }

        .photos-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .photos-list img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            background: #2a2a2a;
        }
    </style>
</head>
<body>

    <!-- Шапка-баннер с аниме -->
    <div class="hero-banner">
        <div class="banner-content">
            <span class="logo-text">Zheka Hubs</span>
            <button class="menu-btn" onclick="alert('Меню в разработке')">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>

    <!-- Основной блок -->
    <main class="main-content">
        <h2 class="section-title">Photos</h2>

        <!-- Папки -->
        <div class="albums-grid">
            <div class="album-card" onclick="openAlbum('my-photos')">
                <div class="folder-icon">📁</div>
                <div>My Photos</div>
            </div>
            <div class="album-card" onclick="openAlbum('images')">
                <div class="folder-icon">📁</div>
                <div>Images</div>
            </div>
            <div class="album-card" onclick="openAlbum('others')">
                <div class="folder-icon">📁</div>
                <div>Others</div>
            </div>
        </div>

        <div class="info-note">
            Нажми на альбом, чтобы посмотреть фотографии ниже...
        </div>

        <!-- Галерея -->
        <div class="gallery-display" id="galleryDisplay">
            <h3 class="gallery-title" id="currentAlbumTitle">Альбом</h3>
            <div class="photos-list" id="photosContainer"></div>
        </div>
    </main>

    <script>
        // Данные фоток
        const albumData = {
            'my-photos': ['my-photos/photo1.jpg', 'my-photos/photo2.jpg'],
            'images': ['images/pic1.jpg', 'images/pic2.jpg'],
            'others': ['others/file1.jpg']
        };

        function openAlbum(albumKey) {
            const display = document.getElementById('galleryDisplay');
            const title = document.getElementById('currentAlbumTitle');
            const container = document.getElementById('photosContainer');
            
            container.innerHTML = '';
            
            const names = {'my-photos': 'My Photos', 'images': 'Images', 'others': 'Others'};
            title.textContent = names[albumKey];

            const photos = albumData[albumKey] || [];

            if(photos.length === 0) {
                container.innerHTML = '<p style="color: #666;">В этой папке пока пусто...</p>';
            } else {
                photos.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.alt = 'Photo';
                    img.onerror = function() {
                        this.src = 'https://placeholder.com';
                    };
                    container.appendChild(img);
                });
            }

            display.classList.add('visible');
            display.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
