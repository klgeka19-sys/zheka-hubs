<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zheka Hubs</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ИСПРАВЛЕНО: Надежный контейнер для шапки */
        .header-container {
            position: relative;
            width: 100%;
            height: 180px; /* Фиксированная высота для телефона */
            background-color: #1a1a1a;
            overflow: hidden;
        }

        /* ИСПРАВЛЕНО: Картинка теперь не сжимает текст */
        .header-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0.6;
        }

        /* ИСПРАВЛЕНО: Неоновые буквы четко на своем месте */
        .neon-text {
            position: absolute;
            top: 30px;
            left: 20px;
            font-family: 'Caveat', cursive;
            font-size: 2.5rem;
            color: #ffffff;
            margin: 0;
            white-space: nowrap;
            animation: neonPulse 3s ease-in-out infinite alternate;
            z-index: 10;
        }

        @keyframes neonPulse {
            0% { text-shadow: 0 0 4px #fff, 0 0 10px #00d2ff, 0 0 20px #00d2ff; }
            100% { text-shadow: 0 0 2px #fff, 0 0 6px #00bcff, 0 0 14px #0077ff; }
        }

        .main-wrapper {
            display: flex;
            flex: 1;
            position: relative;
        }

        /* ИСПРАВЛЕНО: Кнопка "три полоски" теперь не мешает шапке */
        .menu-toggle {
            display: none;
            position: absolute;
            top: 25px;
            right: 20px;
            background-color: #00d2ff;
            color: #121212;
            border: none;
            padding: 10px 15px;
            font-size: 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
        }

        /* Боковое меню */
        .sidebar {
            width: 250px;
            background-color: #1a1a1a;
            padding: 20px;
            border-right: 1px solid #2d2d2d;
            transition: transform 0.3s ease;
            box-sizing: border-box;
        }

        .sidebar h3 {
            color: #00d2ff;
            margin-top: 0;
            border-bottom: 1px solid #2d2d2d;
            padding-bottom: 10px;
        }

        .sidebar button {
            display: block;
            width: 100%;
            background: none;
            border: none;
            color: #aaaaaa;
            text-align: left;
            padding: 12px 10px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .sidebar button:hover, .sidebar button.active {
            background-color: #2d2d2d;
            color: #00d2ff;
        }

        /* Контентная зона */
        .content-area {
            flex: 1;
            padding: 20px;
            background-color: #121212;
        }

        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
        }

        /* Сетка папок */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .grid-card {
            background-color: #1a1a1a;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
        }

        .card-box {
            width: 50px;
            height: 50px;
            background-color: #2d2d2d;
            margin: 0 auto 10px auto;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00d2ff;
            font-size: 1.5rem;
        }

        .viewer-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #1a1a1a;
            border-radius: 8px;
            border: 1px dashed #2d2d2d;
            text-align: center;
            color: #888;
        }

        .music-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #1a1a1a;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #2d2d2d;
        }

        .play-btn {
            background-color: #00d2ff;
            border: none;
            color: #121212;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
        }

        .notes-area {
            width: 100%;
            height: 150px;
            background-color: #1a1a1a;
            border: 1px solid #2d2d2d;
            border-radius: 6px;
            color: #ffffff;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
        }

        footer {
            background-color: #1a1a1a;
            padding: 15px;
            text-align: center;
            border-top: 1px solid #2d2d2d;
            font-size: 0.85rem;
            color: #888888;
            margin-top: auto;
        }

        footer .bible-quote {
            font-style: italic;
            color: #00d2ff;
            margin-bottom: 5px;
        }

        /* Адаптивность под телефон */
        @media (max-width: 768px) {
            .header-container {
                height: 120px; /* Компактная шапка для мобилы */
            }

            .neon-text {
                font-size: 1.8rem;
                top: 40px;
            }

            .menu-toggle {
                display: block; /* Показываем три полоски */
            }

            .main-wrapper {
                flex-direction: column;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                z-index: 95;
                transform: translateX(-100%);
                box-shadow: 5px 0 15px rgba(0,0,0,0.7);
            }

            .sidebar.open {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <!-- Чтобы картинка появилась, нужно будет закинуть файл anime-86.jpg в твой репозиторий на GitHub -->
        <img src="anime-86.jpg" alt="" class="header-bg">
        <h1 class="neon-text">Zheka Hubs</h1>
        <!-- ИСПРАВЛЕНО: Кнопка перенесена внутрь контейнера шапки -->
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    </div>

    <div class="main-wrapper">
        <div class="sidebar" id="sidebarMenu">
            <h3>Navigation</h3>
            <button class="nav-btn active" onclick="showSection('photos', this)">Photos</button>
            <button class="nav-btn" onclick="showSection('music', this)">Music</button>
            <button class="nav-btn" onclick="showSection('video', this)">Video</button>
            <button class="nav-btn" onclick="showSection('notes', this)">Notes</button>
            <button class="nav-btn" onclick="showSection('blog', this)">Blog</button>
        </div>

        <div class="content-area">
            <!-- PHOTOS -->
            <div id="photos" class="page-section active">
                <h2>Photos</h2>
                <div class="grid-container">
                    <div class="grid-card" onclick="openAlbum('My Photos')">
                        <div class="card-box">📁</div>
                        <div>My Photos</div>
                    </div>
                    <div class="grid-card" onclick="openAlbum('Images')">
                        <div class="card-box">📁</div>
                        <div>Images</div>
                    </div>
                    <div class="grid-card" onclick="openAlbum('Others')">
                        <div class="card-box">📁</div>
                        <div>Others</div>
                    </div>
                </div>
                <div class="viewer-box" id="photoViewer">Нажми на альбом, чтобы посмотреть фотографии ниже...</div>
            </div>

            <!-- MUSIC -->
            <div id="music" class="page-section">
                <h2>Music</h2>
                <div class="music-list">
                    <div class="track-item">
                        <div>
                            <div style="font-weight:bold;">Track Name 1</div>
                            <div style="font-size:0.85rem;color:#888;">Artist 1</div>
                        </div>
                        <button class="play-btn">▶ Play</button>
                    </div>
                </div>
            </div>

            <!-- VIDEO -->
            <div id="video" class="page-section">
                <h2>Video</h2>
                <div class="grid-container">
                    <div class="grid-card" onclick="openVideoAlbum('My Videos')">
                        <div class="card-box">🎬</div>
                        <div>My Videos</div>
                    </div>
                </div>
                <div class="viewer-box" id="videoViewer">Нажми на альбом, чтобы посмотреть видео...</div>
            </div>

            <!-- NOTES -->
            <div id="notes" class="page-section">
                <h2>Notes</h2>
                <textarea class="notes-area" placeholder="Напиши сюда что-нибудь..."></textarea>
            </div>
